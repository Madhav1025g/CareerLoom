name: Quality gate (evals)

# Runs the golden-set evals against the real AI and fails if quality drops below the saved baseline.
# To protect the free Groq quota it only runs when prompts or scoring change, or when started by hand
# (Actions tab → "Quality gate (evals)" → Run workflow).
on:
  push:
    branches: [main]
    paths: ["main.py", "prompts/**", "evals/**", "document_builder.py"]
  pull_request:
    paths: ["main.py", "prompts/**", "evals/**", "document_builder.py"]
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated case ids (leave empty for all)"
        required: false

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check the API key is configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add a GROQ_API_KEY repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Run evals and compare with the baseline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
        run: |
          args=""
          if [ -n "${{ inputs.cases }}" ]; then args="--cases ${{ inputs.cases }}"; fi
          set +e
          python -m evals gate $args 2>&1 | tee eval-output.txt
          status=${PIPESTATUS[0]}
          # Show the report on the run's summary page (readable without digging through logs).
          {
            echo "## Eval report"
            echo '```'
            grep -v " INFO " eval-output.txt | grep -v "^INFO" | tail -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/
          if-no-files-found: ignore
