name: Keep app awake

# Visits the live app every 6 hours so Streamlit Community Cloud never puts it to sleep
# (a sleeping app shows visitors a "gone to sleep" page). No secrets or AI calls are used.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit the app
        run: python scripts/keep_awake.py
